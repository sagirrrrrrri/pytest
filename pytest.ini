# pytest 全局配置示例
# 说明：本文件只是示例模板。练习时请把同名文件放在你自己的项目根目录，
# 或在 pyproject.toml 中写 [tool.pytest.ini_options]。
#
# 注意：不要把本文件直接当成"必须生效"的配置——cases/exercises 里的
# 示例可以直接运行，配置文件按需使用。

[pytest]
# 收集规则
python_files = test_*.py *_test.py
python_functions = test_*

# 常用默认参数
addopts = -v --tb=short

# 自定义标记注册（消除 UnknownMarkWarning）
markers =
    slow: 运行较慢的测试
    smoke: 冒烟测试，快速验证核心功能
    unit: 单元测试
    integration: 集成测试
